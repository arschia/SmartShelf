<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bdb6c9"/></marker></defs><rect width="1200" height="720" rx="20" fill="#16141e"/><text x="48" y="65" fill="#f7f0e8" font-family="sans-serif" font-size="31" font-weight="bold">Three channels, three separate guarantees</text><text x="48" y="101" fill="#bdb6c9" font-family="sans-serif" font-size="16">Seeing a video is not proof that an inference frame reached the server.</text><path d="M365 257L445 257" stroke="#bdb6c9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="405" y="238" fill="#f7f0e8" font-family="sans-serif" font-size="15" text-anchor="middle">Separate</text><path d="M755 257L835 257" stroke="#bdb6c9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="795" y="238" fill="#f7f0e8" font-family="sans-serif" font-size="15" text-anchor="middle">Stable</text><path d="M600 335L600 475" stroke="#bdb6c9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="705" y="410" fill="#f7f0e8" font-family="sans-serif" font-size="15" text-anchor="middle">Delivery verification</text><rect x="55" y="180" width="310" height="155" rx="17" fill="#24212d" stroke="#71dbba" stroke-width="2"/><text x="77" y="218" font-family="sans-serif" font-weight="bold" font-size="22" fill="#71dbba">Preview video</text><text x="77" y="250" font-family="sans-serif" font-size="16" fill="#f7f0e8">RTCPeerConnection</text><text x="77" y="275" font-family="sans-serif" font-size="16" fill="#f7f0e8">Target 720p / 30 FPS</text><text x="77" y="300" font-family="sans-serif" font-size="16" fill="#f7f0e8">Actual receiver stats</text><rect x="445" y="180" width="310" height="155" rx="17" fill="#24212d" stroke="#e75b83" stroke-width="2"/><text x="467" y="218" font-family="sans-serif" font-weight="bold" font-size="22" fill="#e75b83">Inference frames</text><text x="467" y="250" font-family="sans-serif" font-size="16" fill="#f7f0e8">Paired WSS + HTTPS fallback</text><text x="467" y="275" font-family="sans-serif" font-size="16" fill="#f7f0e8">Acknowledgments + backpressure</text><text x="467" y="300" font-family="sans-serif" font-size="16" fill="#f7f0e8">Local ONNX processing</text><rect x="835" y="180" width="310" height="155" rx="17" fill="#24212d" stroke="#71dbba" stroke-width="2"/><text x="857" y="218" font-family="sans-serif" font-weight="bold" font-size="22" fill="#71dbba">Store state</text><text x="857" y="250" font-family="sans-serif" font-size="16" fill="#f7f0e8">Temporal + session rules</text><text x="857" y="275" font-family="sans-serif" font-size="16" fill="#f7f0e8">SQLite transaction</text><text x="857" y="300" font-family="sans-serif" font-size="16" fill="#f7f0e8">WebSocket broadcasts</text><rect x="210" y="475" width="780" height="125" rx="17" fill="#24212d" stroke="#e75b83" stroke-width="2"/><text x="232" y="513" font-family="sans-serif" font-weight="bold" font-size="22" fill="#e75b83">Start / Stop confirmation</text><text x="232" y="545" font-family="sans-serif" font-size="16" fill="#f7f0e8">Manager command -&gt; tablet acknowledgment -&gt; same-device new server frame</text><text x="232" y="570" font-family="sans-serif" font-size="16" fill="#f7f0e8">The viewer never submits a duplicate inference stream.</text><text x="48" y="685" fill="#bdb6c9" font-family="sans-serif" font-size="14">SmartShelf 1.4.1 / implementation diagram / not a network benchmark</text></svg>