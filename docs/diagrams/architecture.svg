<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bdb6c9"/></marker></defs><rect width="1200" height="720" rx="20" fill="#16141e"/><text x="48" y="65" fill="#f7f0e8" font-family="sans-serif" font-size="31" font-weight="bold">SmartShelf / Runtime architecture</text><text x="48" y="101" fill="#bdb6c9" font-family="sans-serif" font-size="16">Local inference and persistence, public web UI, direct video preview.</text><path d="M375 215L790 215" stroke="#bdb6c9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="580" y="198" fill="#f7f0e8" font-family="sans-serif" font-size="15" text-anchor="middle">JPEG / WSS or HTTPS</text><path d="M965 325L965 455" stroke="#bdb6c9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1045" y="398" fill="#f7f0e8" font-family="sans-serif" font-size="15" text-anchor="middle">Transactions</text><path d="M790 545L375 545" stroke="#bdb6c9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="580" y="529" fill="#f7f0e8" font-family="sans-serif" font-size="15" text-anchor="middle">Canonical state / WebSocket</text><path d="M210 325L210 455" stroke="#bdb6c9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="295" y="396" fill="#f7f0e8" font-family="sans-serif" font-size="15" text-anchor="middle">Direct WebRTC</text><path d="M790 285L375 485" stroke="#bdb6c9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="595" y="382" fill="#f7f0e8" font-family="sans-serif" font-size="15" text-anchor="middle">Authenticated HTTPS signaling</text><rect x="50" y="175" width="325" height="150" rx="17" fill="#24212d" stroke="#71dbba" stroke-width="2"/><text x="72" y="213" font-family="sans-serif" font-weight="bold" font-size="22" fill="#71dbba">Tablet sensor</text><text x="72" y="245" font-family="sans-serif" font-size="16" fill="#f7f0e8">Chrome camera</text><text x="72" y="270" font-family="sans-serif" font-size="16" fill="#f7f0e8">JPEG inference frames</text><text x="72" y="295" font-family="sans-serif" font-size="16" fill="#f7f0e8">WebRTC video + data channel</text><rect x="790" y="175" width="350" height="150" rx="17" fill="#24212d" stroke="#e75b83" stroke-width="2"/><text x="812" y="213" font-family="sans-serif" font-weight="bold" font-size="22" fill="#e75b83">Windows backend</text><text x="812" y="245" font-family="sans-serif" font-size="16" fill="#f7f0e8">FastAPI + ONNX Runtime</text><text x="812" y="270" font-family="sans-serif" font-size="16" fill="#f7f0e8">Single worker / loopback :8000</text><text x="812" y="295" font-family="sans-serif" font-size="16" fill="#f7f0e8">Tailscale Funnel HTTPS/WSS</text><rect x="790" y="455" width="350" height="125" rx="17" fill="#24212d" stroke="#71dbba" stroke-width="2"/><text x="812" y="493" font-family="sans-serif" font-weight="bold" font-size="22" fill="#71dbba">SQLite + local data</text><text x="812" y="525" font-family="sans-serif" font-size="16" fill="#f7f0e8">Products, events, sessions</text><text x="812" y="550" font-family="sans-serif" font-size="16" fill="#f7f0e8">Stock, carts and invoices</text><rect x="50" y="455" width="325" height="150" rx="17" fill="#24212d" stroke="#e75b83" stroke-width="2"/><text x="72" y="493" font-family="sans-serif" font-weight="bold" font-size="22" fill="#e75b83">Web browsers</text><text x="72" y="525" font-family="sans-serif" font-size="16" fill="#f7f0e8">Vercel static frontend</text><text x="72" y="550" font-family="sans-serif" font-size="16" fill="#f7f0e8">Manager + customer interfaces</text><text x="72" y="575" font-family="sans-serif" font-size="16" fill="#f7f0e8">No manual refresh</text><text x="48" y="685" fill="#bdb6c9" font-family="sans-serif" font-size="14">SmartShelf 1.4.1 / implementation diagram / not a network benchmark</text></svg>