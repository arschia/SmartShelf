name: Source and browser-logic checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python scripts/release_selfcheck.py
      - run: python scripts/check_frontend_paths.py
      - name: Browser-logic regression harnesses
        shell: bash
        run: |
          set -euo pipefail
          for test in scripts/test_*.cjs; do
            node "$test"
          done
